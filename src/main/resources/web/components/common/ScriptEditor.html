<div class="script-editor" :class="{ fullscreen: isFullscreen }">
    <div class="script-editor-content" ref="editor"></div>
    <p v-if="error" role="alert">{{ error }}</p>
    <button type="button" class="fullscreen-toggle" @click="toggleFullscreen()"
        :title="isFullscreen ? 'Exit full screen' : 'Full screen'"
        :aria-label="isFullscreen ? 'Exit full screen' : 'Full screen'">⛶</button>
</div>
