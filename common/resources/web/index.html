<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CheatUtils</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Amsterdam&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="app.css">
    <link rel="stylesheet" type="text/css" href="checkbox.css">
    <link rel="stylesheet" type="text/css" href="main.css">
</head>
<body>
    <div id="vue-app" v-cloak>
        <div class="main-header">
            <div class="title">
                <a href="/#">cheatutils</a>
                <template v-if="module">
                    → <a :href="'/#/' + module.path">{{ module.name }}</a>
                </template>
            </div>
            <div class="search" v-if="isMain()">
                <input type="text" placeholder="Search modules..."
                    v-model="search"
                    ref="searchInput"
                    @input="onFilterInput()"
                    @keydown="onFilterKeyDown($event)">
            </div>
            <div class="notifications" ref="notificationsRoot">
                <button class="bell" type="button"
                    aria-label="Notifications"
                    :aria-expanded="notificationsOpen"
                    @click.stop="onBellClick()">
                    <span aria-hidden="true">&#x1F514;</span>
                    <span class="notifications-count" v-if="unreadNotificationsCount > 0">{{ unreadNotificationsCount }}</span>
                </button>
                <div class="notifications-panel" v-if="notificationsOpen" @click.stop>
                    <div class="notifications-header">
                        <span>Notifications</span>
                        <button type="button" aria-label="Close notifications" @click="notificationsOpen = false">&times;</button>
                    </div>
                    <div class="notifications-list">
                        <button class="notification" type="button"
                            v-for="notification in notifications"
                            :key="notification.id"
                            @click="showNotificationDetails(notification)">
                            <div class="notification-title">{{ notification.title }}</div>
                            <div class="notification-message">{{ notification.message }}</div>
                            <div class="notification-time">{{ formatNotificationTime(notification.createdAt) }}</div>
                        </button>
                        <div class="notifications-empty" v-if="notifications.length == 0">No notifications.</div>
                    </div>
                </div>
            </div>
        </div>
        <component :is="view"></component>
        <dialog class="notification-dialog" ref="notificationDialog" @click.self="closeNotificationDetails()">
            <div class="notification-dialog-header">
                <span>{{ selectedNotification?.title }}</span>
                <button type="button" aria-label="Close notification details" @click="closeNotificationDetails()">&times;</button>
            </div>
            <div class="notification-dialog-message">{{ selectedNotification?.message }}</div>
            <pre>{{ selectedNotification?.details }}</pre>
        </dialog>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
