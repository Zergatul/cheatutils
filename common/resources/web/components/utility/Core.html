<div class="module-main" v-if="config">
    <div class="description">

    </div>

    <div class="module-sections">
        <fieldset>
            <legend>
                HTTP Server Default Port
            </legend>
            <div>
                <input type="text" v-model="config.port" @change="update()">
            </div>
            <div class="section-description">
                Default value: 5005
            </div>
        </fieldset>

        <fieldset>
            <legend>
                <switch-checkbox v-model="config.advancedScripting" @change="update()">Advanced Scripting</switch-checkbox>
            </legend>
            <div class="section-description">
                Enables Java Interop (<b>Java&lt;...&gt;</b> types) in scripts.
                Only enable this for scripts you trust, because Java code can access files, network resources, and other system APIs.
            </div>
        </fieldset>
    </div>
</div>
