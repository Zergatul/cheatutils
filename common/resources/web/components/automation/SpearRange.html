<div class="module-main" v-if="config">
    <div class="description">
       Uses the spear to extend your reach with weapons.
    </div>
    <div class="module-sections">
        <div>
            <switch-checkbox v-model="config.enabled" @change="update()">Enabled</switch-checkbox><br>
        </div>
        <fieldset>
            <legend>
                <switch-checkbox v-model="config.lungeWithoutTarget" @change="update()">Lunge Without Target</switch-checkbox>
            </legend>
            <div class="section-description">
                When Enabled, allows you to use the spear to lunge without having a target. This allows bypassing the cooldown of the spear.
            </div>
        </fieldset>
    </div>
</div>
