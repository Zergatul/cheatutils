<div class="module-main auto-drop" v-if="config">
    <div class="description">
        Drops gargabe from inventory. Use Scripting to assign key bind. Example:
        <CodeBlock :code='`
            autoDrop.dropItems();
        `' />
    </div>

    <div class="module-sections">
        <item-list v-model="config.items" @change="onChange()"></item-list>
    </div>
</div>
