<div class="module-main" v-if="config">
    <div class="description">
        Automatically disables shield if you have an axe available and the target is holding a shield that would block your attack<br>
        Module accounts for target look direction
    </div>

    <div class="module-sections">
        <div>
            <switch-checkbox v-model="config.enabled" @change="update()">Enabled</switch-checkbox>
        </div>


        <div class="description">
            The API for this module uses the name autoStunner internally, Example:
            <CodeBlock :code='`
                autoStunner.toggle();
            `' />
        </div>
    </div>

</div>
