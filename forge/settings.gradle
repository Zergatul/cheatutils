pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }

    includeBuild('../common/build')
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}